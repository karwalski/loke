name: CI

on:
  push:
    # foundation/** is included so the toolchain-migration branch gets a real run
    # before it is merged. Expect build-and-test to fail there while the ooke 3.0.0
    # hold stands; static-checks needs no compiler and must pass.
    branches: [main, develop, 'foundation/**']
  pull_request:
    branches: [main]
  schedule:
    # Weekly toolchain drift check (see the toolchain-drift job).
    - cron: '0 20 * * 0'

env:
  TOKE_DIR: ${{ github.workspace }}/../toke
  OOKE_DIR: ${{ github.workspace }}/../toke-ooke

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Dependencies: toke and ooke are custom compilers not available via
      # package managers. We clone and build them from source. Built
      # binaries are cached between runs keyed on the latest commit SHA
      # of each repo's main branch.
      # ------------------------------------------------------------------

      # Pin to the commits recorded in TOOLCHAIN.lock rather than chasing
      # upstream HEAD. Chasing HEAD means CI breaks on somebody else's commit,
      # at random, with no local reproduction. A separate scheduled job (below)
      # watches HEAD and reports drift without turning main red.
      - name: Read pinned toolchain commits
        id: dep-versions
        run: |
          lockval() { sed -n "s/^$1[[:space:]]*=[[:space:]]*//p" TOOLCHAIN.lock | head -1; }
          echo "toke_sha=$(lockval toke_commit)" >> "$GITHUB_OUTPUT"
          echo "ooke_sha=$(lockval ooke_commit)" >> "$GITHUB_OUTPUT"
          echo "Pinned toke $(lockval toke_commit) ($(lockval toke_version)), ooke $(lockval ooke_commit) ($(lockval ooke_version))"

      - name: Cache toke compiler
        id: cache-toke
        uses: actions/cache@v4
        with:
          path: ${{ env.TOKE_DIR }}
          key: toke-${{ runner.os }}-${{ steps.dep-versions.outputs.toke_sha }}

      - name: Cache ooke framework
        id: cache-ooke
        uses: actions/cache@v4
        with:
          path: ${{ env.OOKE_DIR }}
          key: ooke-${{ runner.os }}-${{ steps.dep-versions.outputs.ooke_sha }}

      - name: Build toke compiler
        if: steps.cache-toke.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/karwalski/toke.git "$TOKE_DIR"
          cd "$TOKE_DIR"
          git checkout --detach "${{ steps.dep-versions.outputs.toke_sha }}"
          make || { echo "::error::Failed to build toke compiler"; exit 1; }

      - name: Build ooke framework
        if: steps.cache-ooke.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/karwalski/ooke.git "$OOKE_DIR"
          cd "$OOKE_DIR"
          git checkout --detach "${{ steps.dep-versions.outputs.ooke_sha }}"
          make || { echo "::error::Failed to build ooke framework"; exit 1; }

      - name: Install system dependencies
        run: |
          brew install openssl@3 sqlite3

      - name: Verify toolchain matches TOOLCHAIN.lock
        run: |
          chmod +x ./scripts/check_toolchain.sh
          ./scripts/check_toolchain.sh

      - name: Build loke
        run: |
          export TOKE_DIR="$TOKE_DIR"
          export OOKE_DIR="$OOKE_DIR"
          chmod +x ./scripts/build_loke.sh
          ./scripts/build_loke.sh

      - name: Self-test the measurement result sink
        run: python3 -m benchmarks.lib.result

      - name: Upload measurement results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurement-results
          path: benchmarks/results/
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload build break report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-break-report
          path: build/break-report.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Run tests
        id: tests
        run: |
          export PATH="$TOKE_DIR:$PATH"
          chmod +x ./scripts/run_tests.sh
          # Capture output for JSON artefact; allow non-zero exit so we
          # can still upload the artefact before failing the job.
          set +e
          ./scripts/run_tests.sh . 2>&1 | tee /tmp/test_output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          set -e

          # Parse results into structured JSON
          PASS=$(grep '^Pass:' /tmp/test_output.txt | awk '{print $2}')
          FAIL=$(grep '^Fail:' /tmp/test_output.txt | awk '{print $2}')
          TOTAL=$(grep '^Total:' /tmp/test_output.txt | awk '{print $2}')

          # Build per-test detail array
          DETAILS=$(grep -E '^(PASS|FAIL|COMPILE_ERROR|LINK_ERROR)' /tmp/test_output.txt | \
            awk '{
              status=$1; file=$2; extra="";
              for(i=3;i<=NF;i++) extra=extra" "$i;
              gsub(/^ /,"",extra);
              printf "{\"status\":\"%s\",\"file\":\"%s\",\"detail\":\"%s\"},", status, file, extra
            }')
          # Remove trailing comma
          DETAILS=$(echo "$DETAILS" | sed 's/,$//')

          cat > /tmp/test_results.json <<ENDJSON
          {
            "run_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "passed": ${PASS:-0},
            "failed": ${FAIL:-0},
            "total": ${TOTAL:-0},
            "exit_code": $TEST_EXIT,
            "tests": [${DETAILS}]
          }
          ENDJSON

          echo "test_exit=$TEST_EXIT" >> "$GITHUB_OUTPUT"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: /tmp/test_results.json
          retention-days: 30

      - name: Fail on test failures
        if: steps.tests.outputs.test_exit != '0'
        run: |
          echo "::error::Tests failed with exit code ${{ steps.tests.outputs.test_exit }}"
          exit ${{ steps.tests.outputs.test_exit }}

  # Runs without the toke/ooke toolchain, so it is useful during the
  # toolchain hold when build-and-test cannot pass. Checks tracked files only:
  # the question is whether a fresh clone is sound.
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the compiler-independent gate steps
        run: |
          chmod +x ./scripts/quality-gate.sh
          ./scripts/quality-gate.sh --step checks

  licence-check:
    name: Licence Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Apache 2.0 compatibility
        run: |
          # Check for GPL dependencies in core (Exo must remain separate)
          grep -r "GPL" packages/ --include="*.toml" || echo "No GPL deps in packages"
          echo "Licence check: Apache 2.0 confirmed"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  # ------------------------------------------------------------------
  # Pinning the toolchain (above) stops CI breaking at random on an
  # upstream commit. It would also let loke drift silently, which is
  # exactly how it fell four months behind. This job watches HEAD on a
  # schedule and reports drift without turning main red.
  # ------------------------------------------------------------------
  toolchain-drift:
    name: Toolchain Drift Watch
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Compare TOOLCHAIN.lock against upstream HEAD
        run: |
          lockval() { sed -n "s/^$1[[:space:]]*=[[:space:]]*//p" TOOLCHAIN.lock | head -1; }
          drift=0
          for dep in toke ooke; do
            pinned=$(lockval "${dep}_commit")
            head=$(git ls-remote "$(lockval "${dep}_repo")" HEAD | cut -f1 | cut -c1-7)
            if [ "$pinned" != "$head" ]; then
              echo "::warning::${dep} has moved: pinned ${pinned}, upstream HEAD ${head}"
              drift=1
            else
              echo "${dep} current at ${pinned}"
            fi
          done
          if [ "$drift" -eq 1 ]; then
            echo "Run a toolchain-currency pass (epic F10) and re-pin TOOLCHAIN.lock." >&2
          fi
