# tkc.toml — loke's compiler limits and capability manifest (story F10.9)
#
# toke's capability broker is deny-by-default (ADR-0010, toke 124.4g). A binary is born
# with no filesystem, network, environment-write or process authority; a gated call that
# was not granted aborts the program with
#
#     CAP001: capability 'fs.read' required but not granted
#
# Grants come from two places, and they ADD:
#   1. this file's [capabilities] table, baked into the binary when its entry module is
#      compiled (llvm.c emits @__tk_cap_baked_grants in the module that defines main);
#   2. `--allow-read`, `--allow-write`, `--allow-net`, `--allow-env`, `--allow-run` or
#      `--allow-all` on the compiled program's own command line, parsed by the runtime.
# scripts/lib/build_tree.sh passes --config=<repo>/tkc.toml to every compile, so loke,
# moke and loke-cli all carry the grants below. No launcher in this repository passes an
# --allow-* flag, so these grants are the whole of what the three binaries can do.
#
# Measured at the pin (0b0bc4e), 2026-09-28, with a probe that exercises one gated call
# per class: built with an empty manifest, all five classes trap CAP001; built with this
# file, fs.read, fs.write, net and process.spawn succeed and env.set traps.
#
# WHAT THIS DOES NOT ENFORCE. Read this before treating it as a control.
#   * Scoping. toke's parser accepts `true` or a quoted string, and src/config.c treats
#     any non-empty string as `true` for the whole class ("coarsened to the whole class
#     for now (124.4c refines it)"). `net = "127.0.0.1"` would grant every host, so the
#     grants below are written as `true`: a string would read as a limit that does not
#     exist. The intended scope of each is in its comment. Filed as T-59.
#   * The launcher. Whoever starts the binary can add any class with an --allow-* flag,
#     at any position on the command line. The manifest bounds what loke's CODE can do
#     without a visible diff here, not what the person running it can grant. Also T-59.
#   * `enforce`. Enforcement is the pin's default whether or not this key is set;
#     tk_cap_init does not read the baked flag. It is set so that the intent survives if
#     the default ever flips back.
#   * Environment READS are not a capability in toke. env.get and os.getenv are ungated,
#     which is how provider keys are read (core/providers/dispatcher.tk).

# ── Compiler limits ──────────────────────────────────────────────────────────
#
# These are top-level keys on purpose: src/config.c treats the section-less part of this
# file as the limits block, and a limit written under [capabilities] is rejected as a
# capability ("wants true/false or a quoted path"). Keep them above the first header.
#
# max_funcs is no longer set here (F10.39). toke 3.1.0 raised the default max_funcs and
# max_structs from 128 and 64 to 1024 (127.250), checks both caps at --check, and names the
# flag in its E9010 when a module passes one. Measured when the key was dropped: every module
# of loke, loke-cli and moke compiles at the default. The largest, page.api.pipeline, had
# needed 592 at toke 0b0bc4e (bisected; the history of that figure is in the git log of this
# file). When E9010 names --max-funcs again, bisect and set it here; do not guess.

# toke's default import cap is 32 aliases per module (src/tkc_limits.h, TKC_MAX_IMPORTS), and
# ooke's gen_handlers.sh writes ONE registry module, packages/moke/src/_handlers.tk, that imports
# std.http and every page (ooke O-2 in docs/upstream/handoff-2026-09-27.md). Routing MK6.5's
# seven unreachable moke handlers takes that registry from 28 imports to 35, and the default
# fails it with E9010 "compiler limit exceeded: too many imports", a diagnostic that does not
# name the setting (T-56). Measured in docs/upstream/repro-2026-09-27/T-56/: the pinned toke and
# main both compile, link and run a 35-page registry with the cap raised. 40 is 35 plus room for
# a few more pages; when E9010 returns, count the registry's imports and raise it again.
max_imports = 40

[capabilities]

# Four of toke's five classes are granted, and each is needed by all three binaries.
# Measured 2026-09-28 (F10.9 in docs/epics-and-stories.md): with ONE grant removed from
# the entry module, each binary's own smoke fails and the binary prints CAP001 for that
# class. A denied call exits the whole process, so inside a server it reads as a dropped
# connection, not an error response. scripts/check_capabilities.sh (in the gate) checks
# that this file still parses to exactly these four and that all three binaries carry it.

# fs.read — configuration, policy files, the SQLite database, ooke's config and templates.
#   ~/.loke/config.toml, ~/.loke/policies/, ~/.loke/loke.db   shared/config.tk,
#                                                               core/policy/loader.tk,
#                                                               core/storage/db.tk
#   ooke.toml, templates/, static/ beside the binary           ooke
#   ~/.loke/models/                                             core/models/infer.tk
# std.db needs fs.read AND fs.write to open any database (db.c).
# Without it: loke and moke abort at start-up; loke doctor and loke benchmark abort.
# Intended scope: ~/.loke and the directory the server runs from. Not enforceable (T-59).
fs_read = true

# fs.write — loke's own state.
#   ~/.loke/loke.log     shared/log.tk. Never PII: privacy/logsanitiser.tk redacts first
#   ~/.loke/loke.db      the audit trail, disclosure ledger and memory palace
#   ~/.loke/exports/     user-initiated exports (core/policy/export.tk)
#   benchmark results    loke benchmark's result file
# Without it: many loke and moke routes lose their worker; loke doctor and loke
# benchmark abort.
# Intended scope: ~/.loke and a result path the user names. Not enforceable (T-59).
fs_write = true

# net — both directions: the ooke server's listening socket (http.c bind_listen) and every
# client connection (client_tcp_connect), one class for both.
#   listen   loke 11430, moke 11432
#   connect  Ollama 11434, Presidio 5000, LLMLingua 5001, loke 11430 from moke and loke-cli
# Without it: loke and moke abort before listening; loke doctor and benchmark abort.
# Intended scope: listening on loopback only; connecting to loopback, plus the hosted
# providers over https. Not enforceable: this grant lets code connect to any host (T-59).
# The listeners bind 127.0.0.1 (GA2.5: ooke rc.2 binds [server] host, and the net.listen
# servers name 127.0.0.1), checked by scripts/check_loopback_binds.py and the smokes. What
# decides where a provider request may go is core.providers.transport: https to any host,
# which toke 3.1.0 verifies (F5.11, lifting the T-58 hold), or http to loopback only. That
# is a check in loke's code, not a property of this grant.
net = true

# process.spawn — fixed argv vectors, never a shell string.
#   nc -z 127.0.0.1 <port>, curl (loopback DELETE)   shared/reachability.tk, all three
#   sysctl, vm_stat, top, ps, curl localhost:11434    core/monitoring/sysmon.tk,
#                                                      moke/pages/sysmon.tk
#   ollama serve / pull / list                         core/installer/
# Without it: loke's /api/health, /api/models, /api/pipeline, /installer and /sysmon, and
# moke's /api/health, /api/pipeline and /api/ml/propose, lose their worker; loke doctor
# aborts when a service is down (it confirms with nc).
# Intended scope: those executables. Not enforceable (T-59).
process_spawn = true

# env.write — NOT GRANTED. Nothing in loke, moke, loke-cli or ooke calls env.set or
# os.setenv. From 2026-09-22 to 2026-09-28 this file said `env = true`, commented as
# "provider API keys come from the environment". Reading the environment is not gated;
# `env` is toke's short spelling of env_write, so that line granted the one class loke
# does not use, while a later comment said env.write was not granted.
env_write = false

enforce = true
