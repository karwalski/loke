# tkc.toml — loke's capability manifest (story F10.9)
#
# toke's capability broker is deny-by-default: a binary that has not been granted a
# capability traps at run time with CAP001 rather than performing the operation. loke
# declared nothing, so every path that writes a log line — which is most of them —
# failed the moment it ran. A test found that, not a review.
#
# WHAT THIS FILE DOES AND DOES NOT ENFORCE. Read this before treating it as a control.
# toke's config parser accepts `true` or a single quoted string per capability, and
# src/config.c says scoping is "coarsened to the whole class for now (124.4c refines
# it)". So a path or host written here grants the WHOLE class: `read = "~/.loke"`
# grants filesystem read everywhere, not just under ~/.loke. The scopes below are
# therefore the intent, recorded for when upstream lands per-path enforcement, and the
# strings are chosen so this file needs no edit when that happens.
#
# Until then the honest claim is the coarse one: loke needs filesystem read and write,
# network, environment and process spawn, and nothing else — no keychain, no clipboard,
# no environment WRITE. That is still worth stating, because it is checkable and it
# bounds what a future code path can do without a visible diff here.

# ── Compiler limits ──────────────────────────────────────────────────────────
#
# These are top-level keys on purpose: src/config.c treats the section-less part of this
# file as the limits block, and a limit written under [capabilities] is rejected as a
# capability ("wants true/false or a quoted path"). Keep them above the first header.
#
# toke's codegen tracks function signatures in a fixed-size table sized by max_funcs,
# default 128 (src/tkc_limits.h). The table counts every signature the module can SEE —
# its own functions and every function of every module it imports — not just the ones it
# declares. That is why the module which first hit the ceiling,
# core/memory/mcp_server.tk, has only 25 functions of its own but eleven imports, while
# shared/src/types.tk declares 35 and compiles.
#
# Measured, not guessed: mcp_server.tk needs 129, bisected with --max-funcs. loke crossed
# the default by exactly one function, mid-session, when the local toolchain moved. The
# failure is E9010 "compiler limit exceeded: too many functions" with no line number and
# no statement of what the limit is or that it is configurable, so it reads as a compiler
# bug rather than as a setting — filed upstream as T-25.
#
# 256 rather than 129 because the trend is one-directional: every import a module gains
# pulls in that module's whole export list. When E9010 returns, re-measure by bisection
# and raise it; do not double it blindly.
#
# 320 rather than 256 as of GA1.5-GA1.7. browser/pages/api/pipeline.tk gained five imports
# when the provider stopped being chosen by API-key length — core.router.router,
# core.optimiser.{cache,budget,budgettypes}, core.models.infer and core.storage.settings —
# and each of those pulls in its own whole export list plus its transitive imports. Measured
# by bisection with --max-funcs, as the note above asks: pipeline.tk needs exactly 261. 320
# is the next step with headroom, not a doubling.
#
# 400 rather than 320 as of 2026-09-24. pipeline.tk gained core.metrics.collector (DA1.3),
# which transitively pulls in core.governance.external. Measured on the merged tree: 320
# fails with "compiler limit exceeded: too many functions", and 400 compiles. The exact
# threshold was not re-bisected after the merge. The GA5.5 work in progress, parked on
# work/da-wip, measured 346 with its own extra imports.
#
# 480 rather than 400 as of GA5.26 (2026-09-27). pipeline.tk gained
# core.governance.approvalgate and four functions of its own. Bisected with --max-funcs
# at the pinned toke: 406 fails, 407 compiles. 480 is the next step with headroom.
max_funcs = 480

# toke's default import cap is 32 aliases per module (src/tkc_limits.h, TKC_MAX_IMPORTS), and
# ooke's gen_handlers.sh writes ONE registry module, packages/moke/src/_handlers.tk, that imports
# std.http and every page (ooke O-2 in docs/upstream/handoff-2026-09-27.md). Routing MK6.5's
# seven unreachable moke handlers takes that registry from 28 imports to 35, and the default
# fails it with E9010 "compiler limit exceeded: too many imports", a diagnostic that does not
# name the setting (T-56). Measured in docs/upstream/repro-2026-09-27/T-56/: the pinned toke and
# main both compile, link and run a 35-page registry with the cap raised. 40 is 35 plus room for
# a few more pages; when E9010 returns, count the registry's imports and raise it again.
max_imports = 40

[capabilities]

# fs.read — configuration, policy files, the SQLite database, local model files.
#   ~/.loke/config.toml     shared/config.tk
#   ~/.loke/policies/*.json core/policy/loader.tk
#   ~/.loke/loke.db         core/storage/db.tk
#   ~/.loke/models/*.gguf   core/models/infer.tk
# Intended scope: ~/.loke and the ooke project directory. Nothing in loke has a reason
# to read the user's documents.
read = "~/.loke"

# fs.write — three things, all under loke's own directory.
#   ~/.loke/loke.log        shared/log.tk. Never PII: privacy/logsanitiser.tk redacts
#                           first, and tests/unit/privacy/test_log_sanitiser.tk asserts
#                           it for emails and phone numbers
#   ~/.loke/loke.db         the audit trail and the memory palace
#   ~/.loke/exports/        user-initiated exports (core/policy/export.tk)
write = "~/.loke"

# net — providers and the two local sidecars.
#   127.0.0.1               Ollama 11434, Presidio 5000, LLMLingua 5001,
#                           loke 11430, moke 11432
#   api.anthropic.com       core/providers/anthropic.tk
#   api.openai.com          core/providers/openai.tk
#   api.github.com          core/feedback/report.tk, user-initiated issue reports
# Intended scope: those hosts only. Note what this cannot yet do: once per-host
# enforcement exists, an allow-list turns "every provider call traverses the privacy
# filter" from a review convention (CLAUDE.md) into a runtime property. That is the
# reason to keep this list enumerated in the comment even while the grant is coarse.
net = "127.0.0.1"

# env — provider API keys come from the environment, not from a config file that gets
# committed (core/providers/dispatcher.tk:getapikeys).
env = true

# process.spawn — the Ollama lifecycle only.
#   ollama serve / pull / list   core/installer/{start,pull,updater,autostart}.tk
run = "ollama"

# NOT GRANTED, each absence deliberate:
#   env.write   nothing in loke sets an environment variable
#
# `enforce` is not set. Setting it bakes deny-by-default into the binary, which is
# where this should end up — but it should be turned on deliberately, with the full
# test suite green against it, rather than as a side effect of writing this file.
# Tracked in F10.9.

