# =============================================================================
# loke Policy Preset: APRA CPS 234 — Information Security
# =============================================================================
#
# Prudential Standard CPS 234 applies to APRA-regulated entities in Australia
# and has been in force since 1 July 2019. It is the reason this preset exists:
# loke's primary market is ANZ financial services, and CPS 234 is the standard
# that bites hardest on sending data to a third-party model provider.
#
# WHAT THIS PRESET IS, AND IS NOT
#
#   It is a set of policy defaults that make some CPS 234 controls easier to
#   operate and easier to evidence.
#
#   It is NOT compliance. CPS 234 obligations fall on the APRA-regulated
#   entity, not on a tool it uses, and they cannot be discharged by
#   configuration. In particular loke cannot perform the entity's third-party
#   assessment for it, cannot maintain its incident-notification obligations,
#   and cannot substitute for internal audit. Anything below that reads like a
#   control is an input to the entity's own assessment.
#
# THE OBLIGATIONS THIS PRESET IS SHAPED BY
#
#   Roles and responsibilities  — defined accountability for information
#                                 security, up to and including the Board.
#   Capability                  — information security capability commensurate
#                                 with the threats and with the criticality of
#                                 the assets.
#   Asset identification and    — information assets classified by criticality
#   classification                and sensitivity. This is the hook loke's
#                                 sensitivity classification maps onto.
#   Controls                    — implemented in proportion to criticality and
#                                 sensitivity, and to the consequences of
#                                 compromise.
#   Third parties               — THE CENTRAL ONE FOR THIS TOOL. Where an
#                                 information asset is managed by a third
#                                 party, the entity must be satisfied that the
#                                 third party's information security is
#                                 commensurate. An external model provider
#                                 receiving data is exactly this case.
#   Testing                     — systematic testing of control effectiveness,
#                                 with independent review.
#   Incident management         — response plans, reviewed and tested.
#   Notification                — APRA must be notified of a material
#                                 information security incident within 72
#                                 hours, and of a material control weakness
#                                 within 10 business days.
#
#   Paragraph-level citations are deliberately omitted. Cite the standard text
#   itself, not this file, and have the mapping reviewed by the entity's own
#   risk function.
#
# THE ARGUMENT THIS PRESET MAKES
#
#   The strongest CPS 234 position is not "the data was protected in transit to
#   the provider". It is "the data was never sent to the provider". A control
#   that removes a third-party dependency is easier to evidence than one that
#   manages it, because there is no third-party capability to be satisfied
#   about. That is why this preset defaults to the no-custody path and treats
#   redaction as a fallback requiring justification, rather than the reverse.
#
#   Where data must be sent, this preset makes the decision explicit,
#   attributable and recorded, because an unrecorded disclosure decision cannot
#   be tested and therefore cannot be evidenced.
#
# KNOWN LIMITATIONS OF LOKE AGAINST THIS STANDARD, STATED HONESTLY
#
#   These are real gaps as at 2026-09-19 and they matter for any entity
#   considering this preset. Do not adopt it believing they are closed.
#
#     - The interaction ledger is NOT currently written. Nothing calls the
#       audit logger, so the table is empty (GA5 / GA1.4). Control-operation
#       evidence therefore does not yet exist.
#     - The ledger is NOT tamper-evident. The stored digest does not
#       incorporate the previous record (GA5.2).
#     - Encryption at rest is NOT active. The pragma is ignored by the
#       underlying database, so data is plaintext on disk (X8).
#     - The filter currently FAILS OPEN: when the detection sidecar is
#       unavailable the original text is transmitted (NC1.9).
#     - Detection recall is unmeasured against a labelled corpus for the full
#       pipeline (AD1.2).
#
#   An entity subject to CPS 234 should treat those five as blocking until
#   closed.
#
# =============================================================================

policy_version: "1.0"

metadata:
  name: "APRA CPS 234 — Information Security"
  id: "apra-cps-234"
  description: >
    Policy preset shaped by Prudential Standard CPS 234 for APRA-regulated
    entities. Defaults to no-custody analysis so that an external model
    provider is not a third party managing an information asset. Where data
    must be disclosed, requires an explicit, attributable and recorded
    decision. Classifies information assets by criticality and sensitivity,
    and constrains providers by assessed capability rather than by
    convenience.
  author: "loke project"
  created: "2026-09-19T00:00:00Z"
  updated: "2026-09-19T00:00:00Z"
  regulation_basis:
    - "apra-cps-234"
  jurisdiction: "AU"
  tags:
    - "preset"
    - "australia"
    - "apra"
    - "prudential"
    - "information-security"
    - "financial-services"
  # Signals to the consuming entity that this preset is a starting point.
  requires_entity_review: true
  cannot_discharge:
    - "third-party information security assessment"
    - "incident notification to APRA"
    - "internal audit review of control effectiveness"
    - "Board-level accountability"

# -----------------------------------------------------------------------------
# Information asset classification
#
# CPS 234 requires classification by criticality and sensitivity. loke's single
# sensitivity axis is not sufficient on its own, so criticality is carried
# alongside it and both feed the control decision.
# -----------------------------------------------------------------------------
data_classification:
  levels:
    - name: public
      rank: 0
      description: "Published or publicly available. No disclosure consequence."
    - name: internal
      rank: 1
      description: >
        Internal business information. Disclosure is undesirable but not
        material to the entity or to an individual.
    - name: confidential
      rank: 2
      description: >
        Customer or counterparty information, commercial terms, or internal
        risk assessments. Disclosure has consequences for identifiable people
        or for the entity.
    - name: restricted
      rank: 3
      description: >
        Information whose compromise would be material: customer financial
        position, account and payment credentials, government identifiers,
        and any information attracting a notifiable-data-breach assessment.
    - name: critical
      rank: 4
      description: >
        Information assets supporting a critical operation, where compromise
        or unavailability would threaten the entity's ability to operate.
        Criticality is a separate question from sensitivity and is recorded
        separately.

  default_level: confidential

  # Default to confidential rather than internal, deliberately. In a financial
  # services context the common case is customer information, so the safe
  # default is the one that assumes it.

  rules:
    # Government and financial identifiers. Restricted without exception.
    - pattern: au_tfn
      level: restricted
      description: "Tax File Number. Handling is separately constrained by the TFN Guidelines."
    - pattern: au_medicare
      level: restricted
      description: "Medicare number. NOTE: loke has no detector for this (AD1.1)."
      detector_status: absent
    - pattern: au_abn
      level: confidential
      description: "ABN is public for entities but appears alongside restricted data."
    - pattern: au_bsb
      level: restricted
      description: "BSB. NOTE: no detector (AD1.1)."
      detector_status: absent
    - pattern: bank_account_number
      level: restricted
      description: "Account number. NOTE: no detector, and indistinguishable from any 8-digit number (AD1.1)."
      detector_status: absent
    - pattern: credit_card
      level: restricted
      description: "Card number. Also in scope for PCI-DSS, which this preset does not address."

    # Customer information.
    - pattern: person_name
      level: confidential
      description: "Customer or staff name."
    - pattern: date_of_birth
      level: restricted
      description: "A strong quasi-identifier; combined with a postcode it is frequently unique."
    - pattern: street_address
      level: confidential
    - pattern: email_address
      level: confidential
    - pattern: phone_number
      level: confidential

    # Credentials and secrets.
    - pattern: api_key
      level: restricted
      description: "Credential. Compromise is an incident, not a disclosure."
    - pattern: password
      level: restricted

    # Derived and aggregate information. Included because the common error is
    # assuming aggregates are safe.
    - pattern: aggregate_statistic
      level: internal
      description: >
        Aggregates are NOT automatically safe. Small cell counts and repeated
        differently-filtered queries can reconstruct individual records. Where
        aggregates are disclosed, the query-channel constraints below apply.

# -----------------------------------------------------------------------------
# Disclosure path — the core of this preset
# -----------------------------------------------------------------------------
disclosure:
  # No-custody is the default. An external provider that never receives an
  # information asset is not a third party managing one.
  default_path: no_custody

  no_custody:
    description: >
      Schema profile and intent are disclosed; no data values are. The profile
      carries column names, types, cardinality and null rate only.
    permitted_levels: [public, internal, confidential, restricted, critical]
    schema_profile_must_exclude:
      - sample_values
      - minimum
      - maximum
      - mean
      - any_cell_value
    # The residual risk that remains even on this path, stated so it is not
    # assumed away. See UPSTREAM / NC1.10.
    residual_risks:
      - "Column names can themselves disclose business logic or regulatory scope."
      - >
        A returned query is an information channel. An adversary able to shape
        queries and observe results across turns can extract values a piece at
        a time. Bounding this is an open problem (NC1.10).

  redact_and_forward:
    description: >
      Data values are transmitted after detection and substitution. Available
      only with explicit justification, because it makes the provider a third
      party managing an information asset.
    requires_justification: true
    requires_recorded_decision: true
    max_level: confidential
    # Restricted and critical assets may not take this path at all. There is no
    # configuration that permits it, deliberately.
    prohibited_levels: [restricted, critical]
    stated_limitation: >
      Redaction reduces disclosure. It does not prevent identification:
      peer-reviewed work establishes that models infer and re-identify
      obscured entities from surrounding context. Do not represent this path
      to an assessor as de-identification.

  fail_closed: true
  # When no detection layer is healthy the request must fail, not proceed.
  # NOTE: loke does not currently honour this — see NC1.9. Until that is fixed
  # this setting is aspirational and an entity should not rely on it.
  fail_closed_enforced: false

# -----------------------------------------------------------------------------
# Third-party (provider) management
#
# The CPS 234 hook that matters most. A provider is not permitted by default;
# it is permitted once the entity has assessed it and recorded the assessment.
# -----------------------------------------------------------------------------
provider_restrictions:
  default_action: deny

  # An entity must record its own assessment. loke cannot perform it, and a
  # preset that shipped providers pre-approved would be misleading.
  requires_recorded_assessment: true
  assessment_fields:
    - assessed_by
    - assessed_on
    - data_residency
    - retention_period
    - training_use
    - subprocessors
    - incident_notification_terms
    - contractual_right_to_audit
    - review_due

  providers:
    - id: local
      action: allow
      description: >
        On-device inference. Not a third party, so no assessment is required.
        This is the only provider permitted for restricted and critical assets
        by default, and the reason local capability is a CPS 234 control rather
        than a convenience.
      max_level: critical

    - id: "*"
      action: deny
      description: >
        Every external provider is denied until the entity records an
        assessment. Enabling one is a deliberate act with an owner and a date.
      max_level: confidential
      conditions:
        - "recorded assessment present and not past its review date"
        - "disclosure path is no_custody, or a justification is recorded"

  # Concentration is a CPS 230 concern that shows up here too: an entity
  # relying on a single provider for a critical operation has a dependency to
  # manage, and local capability is what reduces it.
  concentration_warning_threshold: 0.8

# -----------------------------------------------------------------------------
# Evidence and testing
#
# CPS 234 requires that control effectiveness be tested and independently
# reviewed. That needs records, and this section describes what loke should
# produce. Note what it does not produce today.
# -----------------------------------------------------------------------------
evidence:
  interaction_ledger:
    required: true
    # Honest status. See the header.
    implemented: false
    blocking_stories: ["GA5.5", "GA1.4"]
    must_record:
      - correlation_id
      - timestamp_iso8601
      - disclosure_path
      - asset_classification
      - provider
      - entities_detected_count
      - detection_layers_consulted
      - policy_decision
      - justification_where_required
      - approver_where_required
      - bytes_disclosed
      - rows_disclosed

  tamper_evidence:
    required: true
    implemented: false
    blocking_stories: ["GA5.2", "GA5.3"]
    description: >
      A ledger that cannot be shown to be unaltered is a usage record, not
      control evidence. Until the digest chains, do not present it as the
      latter.

  control_testing:
    # What an entity would need to test, and where loke can supply the harness.
    - control: "Detection recall on the classified patterns"
      method: "Labelled corpus, entity-level scoring with a recall floor"
      harness: "tests/fixtures/pii-corpus"
      status: "regex layer measured; full pipeline pending AD1.2"
    - control: "No-custody invariant — no data value is disclosed"
      method: "Sentinel value in the data, asserted absent from every outbound payload"
      harness: "pending NC1 / MK21.11"
      status: "not implemented"
    - control: "Fail-closed behaviour when detection is unavailable"
      method: "Disable the detection layer, assert the request is refused"
      status: "currently FAILS OPEN — NC1.9"
    - control: "Enforcement coverage when traffic is not in path"
      method: "Enumerated bypass corpus, reported as N of 6 classes"
      harness: "docs/specifications/enforcement-bypass-corpus.md"
      status: "specified, not run"

  independent_review:
    supported: false
    description: >
      loke can supply records for review; it cannot conduct the review. The
      entity's internal audit function retains that obligation.

# -----------------------------------------------------------------------------
# Incident management and notification
#
# loke can detect and record; the entity notifies. The distinction is not
# cosmetic, and a preset that implied otherwise would be dangerous.
# -----------------------------------------------------------------------------
incident:
  detect_and_record: true
  notify_apra: false
  notification_obligation_rests_with: "the APRA-regulated entity"

  # Recorded so an entity can wire its own alerting, not so loke can claim to
  # discharge the obligation.
  reference_windows:
    material_incident_hours: 72
    material_control_weakness_business_days: 10

  triggers_to_surface:
    - id: unredacted_disclosure
      description: >
        Data transmitted without the detection layer having run, including via
        the fail-open path. This is the highest-severity trigger and the most
        likely to be materially reportable.
      severity: critical
    - id: restricted_asset_on_forward_path
      description: "A restricted or critical asset took the redact-and-forward path."
      severity: critical
    - id: provider_used_without_assessment
      description: "An external provider was used with no recorded assessment, or past its review date."
      severity: high
    - id: detection_layer_unavailable
      description: "A configured detection layer was unavailable for a request."
      severity: high
    - id: credential_detected_outbound
      description: "An API key or password was detected in an outbound payload."
      severity: critical
    - id: bypass_observed
      description: "Traffic reached a provider without transiting loke."
      severity: high

  kill_switch:
    available: true
    scope: [global, per_provider, per_agent]
    description: >
      Immediate cessation of outbound traffic. Useful during an incident, and
      the state should be recorded in the ledger so its operation can be
      evidenced.

# -----------------------------------------------------------------------------
# Retention
# -----------------------------------------------------------------------------
retention:
  interaction_ledger_days: 2555   # seven years, aligning with common financial record-keeping
  placeholder_mappings_hours: 24
  detected_entity_values: never_persisted
  prompt_content: never_persisted

  notes: >
    Prompt content is deliberately not retained, which is a privacy choice with
    a consequence: the ledger cannot evidence what was in a prompt, only that a
    prompt occurred and how it was classified. State that limitation to an
    assessor rather than leaving it to be discovered.

  at_rest_encryption:
    required: true
    implemented: false
    blocking_story: "X8"
    description: >
      The encryption pragma is ignored by the underlying database, so records
      are plaintext on disk. For a CPS 234 entity this should be treated as
      blocking.

# -----------------------------------------------------------------------------
# Anonymisation — used only on the fallback path
# -----------------------------------------------------------------------------
anonymisation:
  mode: reversible_placeholder
  mapping_leaves_device: false

  # Placeholder scoping is an open decision with a real trade-off (PL1.3), and
  # the current behaviour is neither of the two coherent options.
  placeholder_scope: per_request
  known_defect:
    story: "PL1.1"
    description: >
      Both NER layers emit a constant token, so several entities of the same
      type in one request collapse to a single placeholder and restoration can
      substitute the wrong person's value. Until fixed, the fallback path
      should not be used for multi-party data.

  special_categories:
    mode: block
    description: >
      Health, biometric and similar categories are blocked from the forward
      path rather than substituted, because substitution is not
      de-identification.

# -----------------------------------------------------------------------------
# Sensitivity thresholds
# -----------------------------------------------------------------------------
sensitivity_thresholds:
  warn_at: internal
  require_justification_at: confidential
  require_approval_at: restricted
  block_at: critical
  # Approval means a recorded human decision, not a dialog that defaults to yes.
  approval_must_be_recorded: true

# -----------------------------------------------------------------------------
# Budget limits — included because unmanaged spend on a material service
# provider is an operational risk, which is CPS 230 territory.
# -----------------------------------------------------------------------------
budget_limits:
  daily_usd: 50.0
  monthly_usd: 500.0
  on_exceed: block
  notes: >
    Blocking rather than warning, because an uncapped dependency on an external
    provider is the thing CPS 230 asks an entity to have tolerance limits for.
