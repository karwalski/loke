# =============================================================================
# loke Policy Preset: APRA CPS 230 — Operational Risk Management
# =============================================================================
#
# Prudential Standard CPS 230 applies to APRA-regulated entities and took
# effect on 1 July 2025. It is the newer and, for a tool that introduces a
# third-party dependency into a business process, arguably the more
# consequential of the two APRA standards. CPS 234 asks whether the data is
# secure. CPS 230 asks what happens when the provider is unavailable, who the
# entity depends on, and whether it could keep operating.
#
# WHAT THIS PRESET IS, AND IS NOT
#
#   It is a set of defaults that make an entity's service-provider and
#   continuity position easier to establish and to evidence.
#
#   It is NOT compliance, and CPS 230 is even less amenable to being discharged
#   by configuration than CPS 234. Identifying critical operations, setting
#   tolerance levels, maintaining a service-provider register, and notifying
#   APRA are all obligations of the entity. loke can be a control within that
#   framework and can supply records; it cannot be the framework.
#
# THE OBLIGATIONS THIS PRESET IS SHAPED BY
#
#   Operational risk management — identify, assess and manage operational
#                                 risks, including those arising from people,
#                                 processes, systems and external events.
#   Critical operations         — identify them, and set tolerance levels for
#                                 disruption: maximum period of disruption,
#                                 maximum data loss, and minimum service level.
#   Business continuity         — maintain a plan, test it, and be able to
#                                 operate within tolerance during disruption.
#   Service provider management — identify MATERIAL service providers, assess
#                                 them, contract with them on specified terms,
#                                 maintain a register, and manage concentration
#                                 and fourth-party risk.
#   Notification                — APRA must be notified of material service
#                                 provider arrangements, and of disruptions
#                                 outside tolerance.
#
#   Paragraph-level citations are deliberately omitted. Cite the standard, have
#   the mapping reviewed by the entity's risk function, and note that CPS 230
#   is supported by prudential practice guidance that is worth reading
#   alongside it.
#
# THE ARGUMENT THIS PRESET MAKES, AND WHY IT IS DIFFERENT FROM CPS 234's
#
#   Under CPS 234 the claim is: the provider never received the data, so there
#   is no third-party information security to be satisfied about.
#
#   Under CPS 230 the claim is narrower and worth stating precisely, because
#   overstating it is easy. loke does NOT remove the provider dependency in
#   general — a no-custody request still requires the provider to be reachable
#   in order to return an artifact. What it changes is the SHAPE of the
#   dependency:
#
#     - The disclosure consequence of a provider compromise is reduced to the
#       schema, because that is all the provider ever held.
#     - Local inference gives a genuine degraded mode, so a provider outage can
#       be a reduction in capability rather than a stop. THAT is the continuity
#       control, and it is real.
#     - A locally-executed artifact keeps working on data the provider cannot
#       reach, so an in-flight analysis survives an outage mid-session.
#     - Concentration risk is measurable, because the local-versus-provider
#       ratio is a number rather than an impression.
#
#   Do not claim loke makes an entity independent of its model provider. Claim
#   that it makes the dependency bounded, measurable and degradable, and that
#   those are the three things CPS 230 asks about.
#
# KNOWN LIMITATIONS AGAINST THIS STANDARD, STATED HONESTLY
#
#   As at 2026-09-19:
#     - There is no service-provider register in loke. The fields below
#       describe what one would carry; nothing maintains it.
#     - Disruption is not currently measured. There is no record of provider
#       availability, latency or failure rate, because nothing calls the
#       metrics collector (DA1.3) and the metrics table has no migration
#       (DA1.2).
#     - The local degraded mode is real but UNVALIDATED on target hardware: the
#       tiered-inference stories are marked complete and have never run on an
#       Apple Silicon machine (epic LC1). An untested fallback is not a
#       continuity control.
#     - Tolerance levels cannot be enforced, only recorded, because loke does
#       not control the provider.
#
#   The third of those is the one to take seriously: a continuity control that
#   has never been exercised should not be presented as one.
#
# =============================================================================

policy_version: "1.0"

metadata:
  name: "APRA CPS 230 — Operational Risk Management"
  id: "apra-cps-230"
  description: >
    Policy preset shaped by Prudential Standard CPS 230 for APRA-regulated
    entities. Treats an external model provider as a candidate material service
    provider, requires it to be registered and assessed before use, sets
    recorded tolerance levels for disruption, and prefers local execution so
    that a provider outage degrades capability rather than stopping an
    operation. Makes concentration measurable rather than assumed.
  author: "loke project"
  created: "2026-09-19T00:00:00Z"
  updated: "2026-09-19T00:00:00Z"
  regulation_basis:
    - "apra-cps-230"
  related_presets:
    - "apra-cps-234"
  jurisdiction: "AU"
  tags:
    - "preset"
    - "australia"
    - "apra"
    - "prudential"
    - "operational-risk"
    - "business-continuity"
    - "financial-services"
  requires_entity_review: true
  cannot_discharge:
    - "identification of critical operations"
    - "setting tolerance levels"
    - "maintaining the service provider register"
    - "notification to APRA of material arrangements or of disruption outside tolerance"
    - "business continuity plan and its testing"

# -----------------------------------------------------------------------------
# Critical operations
#
# CPS 230 requires an entity to identify its critical operations and set
# tolerances. loke cannot know them, so this section is a template the entity
# completes — left deliberately unpopulated rather than guessed at.
# -----------------------------------------------------------------------------
critical_operations:
  # An entity lists its own. Each entry binds a loke use case to an operation
  # so that a disclosure or an outage can be assessed against the right
  # tolerance.
  declared_by_entity: true
  entries: []

  entry_schema:
    - id
    - name
    - description
    - owner
    - loke_use_cases            # which use cases in loke support this operation
    - tolerance_max_disruption  # maximum tolerable period of disruption
    - tolerance_max_data_loss   # maximum tolerable data loss
    - tolerance_min_service     # minimum service level during disruption
    - degraded_mode             # what operating within tolerance looks like
    - review_due

  # Until an operation is declared, any loke use case is treated as supporting
  # one. The conservative default, because an undeclared operation is more
  # likely to be an omission than a genuine absence.
  default_assumed_critical: true

# -----------------------------------------------------------------------------
# Service provider management
#
# The heart of CPS 230 for this tool. An external model provider is a candidate
# material service provider and is denied until registered and assessed.
# -----------------------------------------------------------------------------
service_providers:
  default_action: deny

  # Materiality is the entity's determination. The prompt below exists so the
  # question is asked rather than assumed away.
  materiality_test:
    prompt: >
      Does this provider support a critical operation, or would its failure or
      compromise have a material impact on business operations, the entity's
      risk profile, or its obligations to customers?
    determined_by: "the entity"
    record_determination: true

  register:
    required: true
    implemented: false
    blocking_note: "loke has no service-provider register; this describes what one must carry."
    fields:
      - provider_id
      - legal_entity
      - service_description
      - materiality_determination
      - materiality_determined_by
      - materiality_determined_on
      - data_residency              # where data is processed and stored
      - retention_period
      - used_for_training           # whether inputs may train the provider's models
      - subprocessors               # fourth-party risk
      - contractual_terms_reference
      - right_to_audit
      - incident_notification_terms
      - exit_plan                   # how the entity stops using it, and in what period
      - substitutability            # is there an alternative, and how quickly
      - last_assessed
      - review_due

  providers:
    - id: local
      action: allow
      materiality: not_applicable
      description: >
        On-device inference. Not a service provider, so no register entry and no
        assessment. This is the substitute that makes a provider outage
        survivable, and therefore the continuity control this preset relies on.
      continuity_role: primary_degraded_mode
      # Stated plainly, because it is the weak point of the argument.
      validation_status: >
        UNVALIDATED on target hardware. The tiered-inference stories are marked
        complete but have never run on an Apple Silicon machine (epic LC1). An
        untested fallback should not be presented to an assessor as a
        continuity control until it has been exercised.

    - id: "*"
      action: deny
      description: >
        Every external provider is denied until a register entry exists with a
        current assessment and a recorded materiality determination.
      conditions:
        - "register entry present"
        - "assessment not past its review date"
        - "exit plan recorded"
        - "substitutability recorded"

  # Concentration and fourth-party risk.
  concentration:
    # The local ratio is the measurable form of this. CPS 230 asks about
    # dependency; a ratio is an answer, an assurance is not.
    measure: local_request_ratio
    warn_below: 0.20
    description: >
      If fewer than this proportion of requests can be served locally, the
      entity's dependency on external providers is concentrated and the exit
      and continuity positions should be re-examined.
    # Honest status.
    implemented: false
    blocking_stories: ["DA1.2", "DA1.3"]

  fourth_party:
    require_disclosure: true
    description: >
      A provider's own subprocessors are in scope. An entity cannot assess a
      dependency it cannot see, and model providers commonly use
      infrastructure subprocessors across jurisdictions.

# -----------------------------------------------------------------------------
# Disruption tolerance and degraded operation
#
# What loke does when a provider is unavailable. This is the section an entity's
# continuity plan would reference.
# -----------------------------------------------------------------------------
disruption:
  on_provider_unavailable: degrade_to_local
  # Never silently queue-and-forget: an operation that appears to work and has
  # not is worse for an operational-risk assessment than one that visibly fails.
  on_local_unavailable: fail_visibly

  degraded_mode:
    description: >
      Requests are served by local inference. Capability is reduced — a smaller
      model, higher latency — and the reduction is surfaced to the user rather
      than hidden, so the operation can be assessed against its tolerance.
    must_surface_to_user: true
    must_record_in_ledger: true

  in_flight_analysis:
    description: >
      An artifact already returned executes locally against local data, so an
      analysis in progress survives a provider outage. This is a genuine
      continuity property of the no-custody path and one of the better
      arguments for it.
    survives_provider_outage: true

  measurement:
    required: true
    implemented: false
    blocking_stories: ["DA1.2", "DA1.3"]
    must_record:
      - provider_availability
      - provider_latency
      - failure_count
      - degraded_mode_entries
      - degraded_mode_duration
      - requests_served_locally
    description: >
      Tolerance cannot be assessed without measurement. Nothing currently calls
      the metrics collector and the metrics table has no migration, so there is
      no disruption record at all today. An entity should treat that as
      blocking for CPS 230 purposes.

  notification:
    notify_apra: false
    obligation_rests_with: "the APRA-regulated entity"
    surface_when:
      - "a disruption exceeds a declared tolerance for a critical operation"
      - "degraded mode persists beyond its declared maximum period"
      - "a material service provider arrangement begins or ends"

# -----------------------------------------------------------------------------
# Disclosure path — inherited from the CPS 234 preset, with the operational
# rationale rather than the security one.
# -----------------------------------------------------------------------------
disclosure:
  default_path: no_custody
  rationale: >
    Under CPS 230 the reason to prefer no-custody is not only disclosure
    consequence. It is that the provider holds nothing, so the impact of a
    provider compromise is bounded to the schema, and an exit from that
    provider requires no data deletion or repatriation — which makes the exit
    plan CPS 230 asks for considerably simpler to write and to execute.

  redact_and_forward:
    requires_justification: true
    requires_recorded_decision: true
    # The operational consequence of taking this path, stated so it is weighed.
    operational_consequence: >
      Data held by a provider must be covered by the exit plan: what is
      deleted, by when, and how deletion is evidenced. Choosing this path
      creates an exit obligation that no-custody does not.

  fail_closed: true
  fail_closed_enforced: false
  blocking_story: "NC1.9"

# -----------------------------------------------------------------------------
# Change and exit management
# -----------------------------------------------------------------------------
change_management:
  provider_change_requires_reassessment: true
  # Model version changes are a real operational risk and are routinely
  # treated as invisible. A provider deprecating a model is an availability
  # event, and a silently updated model is a behaviour change.
  model_version_pinning:
    required: true
    rationale: >
      An unpinned model can change behaviour without notice, which is an
      operational risk and destroys reproducibility of any evidence produced
      against it. Pin the version, record it in the ledger, and treat a
      provider's deprecation notice as an availability event with a date.
  deprecation_watch: true

exit_plan:
  required_per_provider: true
  must_specify:
    - "what data the provider holds, if any"
    - "how it is deleted and how deletion is evidenced"
    - "the substitute, and the period to switch to it"
    - "what capability is lost on switching"
  # The argument for no-custody restated in exit terms.
  note: >
    On the no-custody path the first two items are trivial, because the
    provider holds no data. That is a material simplification of the exit plan
    and worth stating in it explicitly.

# -----------------------------------------------------------------------------
# Retention and budget — as CPS 234, with the operational framing
# -----------------------------------------------------------------------------
retention:
  interaction_ledger_days: 2555
  disruption_record_days: 2555
  at_rest_encryption:
    required: true
    implemented: false
    blocking_story: "X8"

budget_limits:
  daily_usd: 50.0
  monthly_usd: 500.0
  on_exceed: block
  rationale: >
    An uncapped spend on a material service provider is an unbounded
    operational exposure. A tolerance limit that is not enforced is not a
    tolerance limit, so this blocks rather than warns.
