[project]
name = "moke"
version = "0.2.0"

[site]
name = "moke"
url = "http://localhost:11432"
language = "en"

[server]
# GA2.5: loopback only. ooke rc.2's default is the same, but the file says what moke means;
# scripts/check_loopback_binds.py (in the gate) fails without it.
host = "127.0.0.1"
port = 11432
admin = false

[paths]
static = "packages/moke/static"
pages = "packages/moke/pages"
extensions = "packages/moke/extensions/core.tk"

[build]
output = "../../dist/moke/"
minify = true
# F10.8: rc.2 reads inlinecss; inline_css was ignored (it defaulted to true).
inlinecss = false

[dependencies]
loke_core = { path = "../core" }
