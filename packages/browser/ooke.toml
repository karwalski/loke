[site]
name = "loke"
url = "http://localhost:11430"
language = "en"

[server]
# GA2.5: loopback only. ooke rc.2 binds this (T-43, fixed); scripts/smoke_serve.sh checks the
# running server with lsof and scripts/check_loopback_binds.py (in the gate) checks this line.
host = "127.0.0.1"
port = 11430
admin = false
corsorigins = "http://localhost:11430,http://127.0.0.1:11430,http://localhost:11432,http://127.0.0.1:11432"

[build]
output = "../../dist/browser/"
minify = true
# F10.8: rc.2 reads inlinecss; inline_css was ignored (it defaulted to true).
inlinecss = false

[paths]
module_paths = ["../../build/interfaces"]
source_paths = ["../../packages/core/src", "../../packages/shared/src", "../../src/browser", "extensions"]
