[site]
name = "loke"
version = "0.2.0"
url = "http://localhost:11430"
language = "en"

[server]
host = "127.0.0.1"
port = 11430
admin = false
corsorigins = "http://localhost:11430,http://127.0.0.1:11430"

[build]
output = "../../dist/browser/"
minify = true
inline_css = false

[paths]
module_paths = ["../../build/interfaces"]
source_paths = ["../../packages/core/src", "../../packages/shared/src", "../../src/browser", "extensions"]

[store]
backend = "flat"
