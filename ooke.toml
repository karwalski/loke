[project]
name = "loke"
version = "0.2.0"
language = "en"
license = "Apache-2.0"

[workspace]
packages = [
  "packages/core",
  "packages/shared",
  "packages/browser",
  "packages/cli",
  "packages/mcp-toke",
  "packages/mcp-broker"
]

[dependencies]
# A semver range cannot express toke's requirement: upstream states that no
# tagged toke release works for loke, and toke's VERSION still reads 2.8.0 well
# past the v2.8.0 tag, so the tag predates the commit loke needs.
# **TOOLCHAIN.lock is the authority**, and scripts/check_toolchain.sh enforces it
# by commit ancestry for toke and by released version for ooke.
# The floors below are advisory only and are deliberately not the gate.
toke = ">= 2.8.0"   # advisory; real requirement is commit b66bd8e or later on main
ooke = ">= 3.0.0"   # gated: released 3.0.0, a -dev pre-release does not satisfy it

[build]
output = "dist/"

[dev]
watch = true
