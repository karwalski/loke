[project]
name = "loke"
version = "0.2.0"
language = "en"
license = "Apache-2.0"

[workspace]
packages = [
  "packages/core",
  "packages/shared",
  "packages/browser",
  "packages/cli",
  "packages/mcp-toke",
  "packages/mcp-broker"
]

[dependencies]
toke = ">= 2.0.0"
ooke = ">= 1.0.0"

[build]
output = "dist/"

[dev]
watch = true
