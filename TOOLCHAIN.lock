# TOOLCHAIN.lock — the toke/ooke versions loke is verified against.
# Updated only by a deliberate toolchain-currency pass (epic F10), never casually.
# Checked by scripts/check_toolchain.sh, which build_loke.sh and CI both call.

# ── toke: pinned by COMMIT, because there is no version to pin ───────────
# Upstream is explicit that no tagged toke release works for loke and that there
# is no version number to give. The requirement is a build of main at or after
# the commit below. toke_version is recorded as advisory only and is NOT gated
# on: the VERSION file lags the tags, which is exactly why a semver comparison
# is the wrong instrument here.
toke_repo        = https://github.com/karwalski/toke
toke_min_commit = 445f519
toke_commit     = 0b0bc4e
toke_version    = 3.0.0
toke_version_gate = advisory

# ── ooke: pinned by TAG ─────────────────────────────────────────────────
# v3.0.0-rc.1 is tagged and pushed, so it can be pinned by name rather than by
# a commit somebody has to look up.
#
# This accepts a release candidate, which reverses the earlier decision to wait
# for a final 3.0.0. The reversal is deliberate and was instructed: upstream
# reports the toolchain ready, and the alternative was leaving 18 stories, the
# 202-file sweep and every compiled-detector figure idle against a tag that may
# not change. What does NOT change is the publication bar: a figure measured
# against an rc is labelled with the rc it was measured against, so if the final
# release moves, every affected number is identifiable.
ooke_repo        = https://github.com/karwalski/ooke
ooke_min_version = 3.0.0-rc.1
ooke_tag         = v3.0.0-rc.1
ooke_commit      = c07c503
ooke_version     = 3.0.0-rc.1
ooke_version_gate = required

# ── Reproducibility ─────────────────────────────────────────────────────
# Both pins are fetchable from the public remotes, verified 2026-09-20:
#   toke  6cc9061 and 1bc4a44 are on origin/feat/type-flow-bytes-redesign
#   ooke  v3.0.0-rc.1 is tagged and pushed
# This was previously false and was the reason CI could not build at all.
toke_commit_published = yes — 0b0bc4e is on origin/main, verified 2026-09-23
ooke_commit_published = yes


# ── 2026-09-23: toke Epic 135 delivered, and the pin moves to a PUBLISHED commit ──
#
# `f7d6c9c..0b0bc4e`, 73 commits, on origin/main. This closes both open problems at once —
# the reproducibility gap and the capability gap — and they were the same problem wearing
# two hats.
#
# **Reproducibility.** The pin was 445f519 while the local checkout sat on an unpublished
# feature branch hundreds of commits ahead, so "the build is green" described a compiler
# nobody else could fetch. `check_toolchain.sh` now reports which commit actually built and
# whether it is reachable; against 0b0bc4e it prints "published (origin/main)" rather than a
# warning. Local HEAD and the pin are the same commit, on main.
#
# **Capabilities.** Every ask in docs/toke-libraries-required.md is in this commit, verified
# by reading stdlib/*.tki at 0b0bc4e rather than by asking:
#
#   std.csv    18 exports — hardened: dialect, raggedreport, lasterrline
#   std.pdf    11 exports — including hastext, the text-layer/scan predicate MK21.4 forks on
#   std.zip     6 exports — read-only, over vendored miniz
#   std.xlsx    8 exports — including datefromserial and datesystem
#   std.ocr    12 exports — macOS Vision from plain C99; ADR-0015
#   std.image  15 exports — including adaptivethreshold, which is the preprocessing step the
#                           OCR pipeline wanted and which we had scoped as five stories of
#                           our own work
#
# toke reports 316 assertions and 0 failures across C008/C029/C031/C032/C033/C030, each
# re-run at delivery rather than quoted from a report. Recorded here because the figure is
# theirs, not ours: loke has not independently verified those suites, and should not restate
# the number as if it had.
#
# Two things upstream declined or did not start, stated so nobody plans against them:
# embedded image extraction, and toke-ocr as a standalone repository. The second is the more
# useful absence — our own docs/toke-libraries-required.md §5 proposed exactly that repository
# and it is now unnecessary, because std.ocr binds the platform recogniser directly.
#
# toke_min_commit stays at 445f519 deliberately. It is the oldest compiler loke is known to
# build against, and the ancestry gate is what lets a contributor track main without a lock
# bump for every upstream fix. What the pin records is what THIS tree was verified against.
#
# One operational note from the delivery, worth keeping because it sends people down the
# wrong trail: on this machine github.com resolves to an Azure address, so every port-22 push
# times out at banner exchange. ssh.github.com:443 works. A port-22 timeout here says nothing
# about a deploy key.

# ── Status ──────────────────────────────────────────────────────────────
verified_on  = 2026-09-23
verified_by  = scripts/check_toolchain.sh
hold_status  = CLEARED — the pin is a published commit, and every capability loke
#              was waiting on is in it. See the 2026-09-23 delivery note below.
#              445f519 IS on origin/main, and every tls.* function channel.tk uses
#              exists at 445f519. CI's build-and-test should build; that is the test.

# ── 2026-09-22: loke now requires a toke commit that is not published ────────
# toke moved 1bc4a44 -> 445f519 between two loke sessions. The new compiler adds
# E4071 (a function body ending in a value expression with no '<'), which rejected
# 157 of 217 loke modules until each was given an explicit return; that part is
# backward-compatible and would still build on 1bc4a44.
#
# What is NOT backward-compatible is std.tls. It was a facade over a finished TLS 1.3
# implementation — every wrapper was `(void)arg; return 0;` — and 445f519 wires it up,
# renaming tls.connecttls/listentls to tls.connect/listen and adding
# tls.mutualconfig(cert; key; peercert). packages/core/src/companion/channel.tk is
# written against that API, so it cannot compile on any published toke.
#
# Consequence, as recorded on 2026-09-22: the local build is green and CI cannot
# reproduce it.
#
# ── 2026-09-23: that block was stale. Both halves of it were false. ──────────
#
# Checked rather than assumed, because "not on any remote" is a claim with an easy test:
#
#   git -C <toke> branch -r --contains 445f519
#     -> origin/HEAD, origin/main, origin/feat/type-flow-bytes-redesign
#
# So 445f519 was published. And the std.tls incompatibility above does not apply to it
# either — channel.tk calls eleven tls functions (certof close connect genselfsigned
# keyof listen mutualconfig pairingcode read tlsconfig write) and `git show
# 445f519:stdlib/tls.tki` exports every one of them. The renamed API landed IN 445f519,
# which is the commit we pin, not after it. The note above confused "new in the pinned
# commit" with "newer than the pinned commit".
#
# Lesson worth keeping, because it cost two days of CI: a hold recorded as a fact still
# needs a re-test. This one was written from a correct observation about 1bc4a44 and then
# carried forward against a pin that had already moved past the problem.
#
# ── The real reproducibility gap, which the stale block was hiding ───────────
#
# The local toke checkout is on feat/type-flow-bytes-redesign, hundreds of commits past
# the pin, and its HEAD is on NO remote:
#
#   git -C <toke> branch -r --contains HEAD   ->   (empty)
#
# check_toolchain.sh passes anything descended from toke_min_commit, which is the right
# policy — a newer compiler is usually fine and waiting on a lock bump for every upstream
# fix is friction nobody absorbs. But it previously printed the LOCK's commit as the
# verified one, so the gate said "445f519 verified" while the binary that built loke was
# a local commit nobody else can fetch. It now prints the commit it actually found and
# warns when that commit is unpublished, so "green against what?" is answerable and every
# figure can carry the commit that produced it.
#
# Local builds may therefore run ahead of the pin, deliberately. CI, pinned and published,
# is the reproducible reference.

