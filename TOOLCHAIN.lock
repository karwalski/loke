# TOOLCHAIN.lock — the toke/ooke versions loke is verified against.
# Updated only by a deliberate toolchain-currency pass (epic F10), never casually.
# Checked by scripts/check_toolchain.sh, which build_loke.sh and CI both call.

# ── toke: pinned by COMMIT, not by version ──────────────────────────────
# Upstream is explicit that **no tagged toke release works** for loke. The
# requirement is a build of main at or after the commit below. Note the local
# VERSION file still reads 2.8.0 well past the v2.8.0 tag, which is precisely
# why a version comparison is the wrong gate here: the tag predates the commit
# loke needs. toke_version is recorded as advisory only and is NOT gated on.
toke_repo        = https://github.com/karwalski/toke
toke_min_commit  = b66bd8e
toke_commit      = 8a9aafe
toke_version     = 2.8.0
toke_version_gate = advisory

# ── ooke: pinned by VERSION, and 3.0.0 is required ──────────────────────
# A "-dev" suffix does not satisfy the requirement: loke needs released 3.0.0.
ooke_repo        = https://github.com/karwalski/ooke
ooke_min_version = 3.0.0
ooke_commit      = b663797
ooke_version     = 3.0.0-dev
ooke_version_gate = required

# ── Status ──────────────────────────────────────────────────────────────
# toke: criterion MET locally — b66bd8e is an ancestor of 8a9aafe.
# ooke: NOT met — local build is 3.0.0-dev, requirement is released 3.0.0.
# So the toolchain migration stays on hold pending ooke 3.0.0.
verified_on  = 2026-09-19
verified_by  = scripts/check_toolchain.sh
hold_status  = ON HOLD — awaiting ooke 3.0.0
