# TOOLCHAIN.lock — the toke/ooke versions loke is verified against.
# Updated only by a deliberate toolchain-currency pass (epic F10), never casually.
# Checked by scripts/check_toolchain.sh, which build_loke.sh and CI both call.

# ── toke: pinned by COMMIT, because there is no version to pin ───────────
# Upstream is explicit that no tagged toke release works for loke and that there
# is no version number to give. The requirement is a build of main at or after
# the commit below. toke_version is recorded as advisory only and is NOT gated
# on: the VERSION file lags the tags, which is exactly why a semver comparison
# is the wrong instrument here.
toke_repo        = https://github.com/karwalski/toke
toke_min_commit  = 6cc9061
toke_commit      = 1bc4a44
toke_version     = 2.8.0
toke_version_gate = advisory

# ── ooke: pinned by TAG ─────────────────────────────────────────────────
# v3.0.0-rc.1 is tagged and pushed, so it can be pinned by name rather than by
# a commit somebody has to look up.
#
# This accepts a release candidate, which reverses the earlier decision to wait
# for a final 3.0.0. The reversal is deliberate and was instructed: upstream
# reports the toolchain ready, and the alternative was leaving 18 stories, the
# 202-file sweep and every compiled-detector figure idle against a tag that may
# not change. What does NOT change is the publication bar: a figure measured
# against an rc is labelled with the rc it was measured against, so if the final
# release moves, every affected number is identifiable.
ooke_repo        = https://github.com/karwalski/ooke
ooke_min_version = 3.0.0-rc.1
ooke_tag         = v3.0.0-rc.1
ooke_commit      = c07c503
ooke_version     = 3.0.0-rc.1
ooke_version_gate = required

# ── Reproducibility ─────────────────────────────────────────────────────
# Both pins are fetchable from the public remotes, verified 2026-09-20:
#   toke  6cc9061 and 1bc4a44 are on origin/feat/type-flow-bytes-redesign
#   ooke  v3.0.0-rc.1 is tagged and pushed
# This was previously false and was the reason CI could not build at all.
toke_commit_published = yes
ooke_commit_published = yes

# ── Status ──────────────────────────────────────────────────────────────
verified_on  = 2026-09-20
verified_by  = scripts/check_toolchain.sh
hold_status  = CLEARED — toke 6cc9061+ and ooke v3.0.0-rc.1 are both available
